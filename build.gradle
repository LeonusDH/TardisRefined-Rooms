// Мультиплатформенный проект на Architectury, по образцу самого Tardis Refined:
// common — общий код, forge и fabric — то, что зависит от загрузчика. Ветка 1.20.1 (бэкпорт).
// API Architectury не используется: игроку не нужен лишний мод, только TR и загрузчик.
plugins {
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply false
    id 'com.gradleup.shadow' version '9.4.2' apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'architectury-plugin'

    group = rootProject.maven_group
    version = "${rootProject.minecraft_version}-${rootProject.mod_version}"

    repositories {
        mavenCentral()
        maven { url = 'https://modmaven.dev/' } // Mekanism, AE2
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' } // Forge Config API Port
        exclusiveContent { // Jade, Tardis Refined
            forRepository { maven { url = 'https://api.modrinth.com/maven' } }
            filter { includeGroup 'maven.modrinth' }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
        options.compilerArgs << '-Xlint:deprecation'
    }
}
