plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.+'
}

version = "${minecraft_version}-${mod_version}"
group = 'leonus.tardis_rooms'
base { archivesName = mod_id }

repositories {
    mavenCentral() // AE2
    maven { url = 'https://modmaven.dev/' } // Mekanism
    exclusiveContent { // Jade
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

configurations {
    // Только для запусков из Gradle (runData, runClient): в собранный мод не попадает.
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

neoForge {
    version = project.neo_version
    runs {
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

dependencies {
    // TARDIS Refined из PR #618 пока нигде не опубликован: jar собирается из ветки PR и кладётся в libs/ (папка не хранится в репозитории, см. README).
    // Только для компиляции: в игре TR ставится отдельным модом.
    compileOnly files("libs/${tardis_refined_jar}")
    // Датагену нужен сам TR: аддон без него не загружается.
    localRuntime files("libs/${tardis_refined_jar}")
    // Необязательная совместимость: химикаты Mekanism, сеть ME и карта памяти AE2, подсказки Jade. Без этих модов аддон работает как обычно.
    compileOnly "mekanism:Mekanism:${minecraft_version}-${mekanism_version}:api"
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
}

// ---------- переводы ----------
// Английский генерирует датаген из TRoomsText: gradlew runData → src/generated/resources (файл хранится в репозитории).
// Остальные языки — обычные файлы в src/main/resources/assets/tardis_rooms/lang/.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xlint:deprecation'
}

tasks.named('processResources', ProcessResources) {
    def props = [mod_id: mod_id, mod_version: mod_version, neo_version: neo_version, minecraft_version: minecraft_version]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') { expand(props) }
}
