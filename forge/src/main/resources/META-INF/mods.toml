modLoader = "javafml"
loaderVersion = "[47,)"
license = "PolyForm-Noncommercial-1.0.0"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "TARDIS Refined: Rooms"
authors = "LeonusDH"
# Переводы описания — в языковых файлах, ключ fml.menu.mods.info.description.tardis_rooms
description = '''A hand-built TARDIS interior: grow rooms and corridors with the sonic screwdriver on a grid, instead of Tardis Refined's endless procedural ARS corridors. The TARDIS Interface carries items, fluids, energy and redstone between rooms and to the outside, plus Mekanism chemicals and AE2 ME networks.'''

[[mixins]]
config = "tardis_rooms.mixins.json"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.21)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tardis_refined"
mandatory = true
versionRange = "[2.1.6,)"
ordering = "AFTER"
side = "BOTH"

# Необязательная совместимость: если мод установлен, версия должна быть не старее той, под которую собран аддон.
[[dependencies.${mod_id}]]
modId = "mekanism"
mandatory = false
versionRange = "[10.4,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ae2"
mandatory = false
versionRange = "[15.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jade"
mandatory = false
versionRange = "[11.0,)"
ordering = "NONE"
side = "BOTH"
