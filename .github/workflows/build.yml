name: Build

# Only the build: jars for testing in game. Tests are in tests.yml and run on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Tardis Refined from PR #618, pinned so builds are reproducible; update it when the PR changes.
  TR_REPO: https://github.com/Whocraft/TardisRefined.git
  TR_REF: 93cc7c8742f11addb44f5b07de00eb7b2fbe47c9

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: ./.github/actions/tardis-refined

      - name: Build the addon
        run: ./gradlew assemble --no-daemon

      - name: Check the release jars contain no test code
        run: |
          status=0
          for jar in $(ls neoforge/build/libs/*.jar fabric/build/libs/*.jar | grep -v -e '-dev' -e '-sources'); do
            echo "$jar: $(unzip -Z1 "$jar" | wc -l) entries"
            if unzip -Z1 "$jar" | grep -E 'gametest|^data/tardis_refined/'; then
              echo "::error file=$jar::test code or test data in the release jar"
              status=1
            fi
          done
          exit $status

      - uses: actions/upload-artifact@v7
        with:
          name: tardis_rooms-${{ github.sha }}
          path: |
            neoforge/build/libs/*.jar
            fabric/build/libs/*.jar
            !**/*-dev-shadow.jar
            !**/*-sources.jar
          if-no-files-found: error
