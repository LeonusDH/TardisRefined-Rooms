name: Build

on:
  push:
    branches: ['1.20.1']
  pull_request:
    branches: ['1.20.1']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the addon
        run: |
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log

      # Ошибки компиляции — аннотациями к запуску, чтобы их было видно без скачивания лога.
      - name: Report errors
        if: failure()
        run: |
          grep -E 'error:|FAILURE|What went wrong|Could not|> ' build.log | grep -v '^> Task' | head -n 200 > errors.txt || true
          split -l 20 errors.txt part_
          for f in part_*; do
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")
            echo "::error title=$f::$msg"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: tardis_rooms-1.20.1-${{ github.sha }}
          path: |
            forge/build/libs/*.jar
            fabric/build/libs/*.jar
            !**/*-dev-shadow.jar
            !**/*-sources.jar
          if-no-files-found: error
