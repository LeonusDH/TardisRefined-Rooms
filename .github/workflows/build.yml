name: Build

# Only the build: jars for testing in game. Tests are in tests.yml and run on demand.
on:
  push:
    branches: ['1.20.1']
  pull_request:
    branches: ['1.20.1']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the addon
        run: |
          set -o pipefail
          ./gradlew assemble --continue --no-daemon 2>&1 | tee build.log

      - name: Check the release jars contain no test code
        run: |
          status=0
          for jar in $(ls forge/build/libs/*.jar fabric/build/libs/*.jar | grep -v -e '-dev' -e '-sources'); do
            echo "$jar: $(unzip -Z1 "$jar" | wc -l) entries"
            if unzip -Z1 "$jar" | grep -E 'gametest'; then
              echo "::error file=$jar::test code or test data in the release jar"
              status=1
            fi
          done
          exit $status

      # Ошибки компиляции — аннотациями к запуску, чтобы их было видно без скачивания лога.
      - name: Report errors
        if: failure()
        run: |
          grep -A2 -E 'error:' build.log | grep -v -E '^\s*\^\s*$|^--$' | head -n 300 > errors.txt || true
          grep -E 'FAILURE|What went wrong|Could not' build.log | head -n 20 >> errors.txt || true
          split -l 20 errors.txt part_
          for f in part_*; do
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")
            echo "::error title=$f::$msg"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: tardis_rooms-1.20.1-${{ github.sha }}
          path: |
            forge/build/libs/*.jar
            fabric/build/libs/*.jar
            !**/*-dev-shadow.jar
            !**/*-sources.jar
          if-no-files-found: error
