name: Suggestion
description: An idea for a new feature or an improvement to an existing one
title: "[Suggestion] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Describing the problem you want to solve helps more than a ready solution — there may be a simpler way to get there.
        You can write in English or Russian.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Growing rooms and corridors
        - Managing rooms (rename, replace, remove, floor map)
        - TARDIS Interface
        - Custom rooms from datapacks
        - Compatibility with another mod
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: What you're trying to do, and what gets in the way right now.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Your idea
      description: How you'd like it to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you've considered, or how you work around it now.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, sketches, links to other mods that do something similar.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this hasn't been suggested yet.
          required: true
