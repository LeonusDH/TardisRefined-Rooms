name: Bug report
description: "Something in TARDIS Refined: Rooms doesn't work as it should"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much as you can — it makes the problem much faster to find.
        If the problem is in TARDIS Refined itself and happens without this addon, please report it to [TARDIS Refined](https://github.com/Whocraft/TardisRefined/issues) instead.
        You can write in English or Russian.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A short description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What to do, step by step, to make the problem happen.
      placeholder: |
        1. Grow a room from a growth node
        2. Place an interface next to a chest
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: minecraft
    attributes:
      label: Minecraft version
      options:
        - "1.20.1"
        - "1.21.1"
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Mod loader
      options:
        - Forge
        - NeoForge
        - Fabric
    validations:
      required: true

  - type: input
    id: addon-version
    attributes:
      label: "TARDIS Refined: Rooms version"
      description: Shown in the mod list or in the jar name.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: tr-version
    attributes:
      label: TARDIS Refined version
      placeholder: "2.1.7"
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Other relevant mods
      description: Mods involved in the problem (pipes, storage, energy, Mekanism, AE2, Jade…) with their versions, or the modpack name and version.
      placeholder: "Mekanism 10.7.x, Applied Energistics 2 19.x, or: All the Mods 10 v4.x"

  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: |
        Upload `logs/latest.log` (and the crash report from `crash-reports/`, if the game crashed) to [mclo.gs](https://mclo.gs) and paste the link here.
      placeholder: https://mclo.gs/...

  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Drag and drop images or videos here, if they help to show the problem.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this bug hasn't been reported yet.
          required: true
        - label: I'm using the latest version of the addon for my Minecraft version.
          required: false
