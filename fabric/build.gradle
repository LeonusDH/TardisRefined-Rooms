plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

base { archivesName = "${rootProject.mod_id}-fabric" }

configurations {
    // Код из common: в разработке — как есть, в готовый jar — после преобразования под Fabric.
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    // Конфиг на ForgeConfigSpec. Ставится вместе с TR (вложен в его jar), поэтому сами его не вкладываем.
    modCompileOnly "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${rootProject.forge_config_api_port_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }

    // Энергия: Team Reborn Energy — стандарт на Fabric. Необязательна: её обычно вкладывают в себя технические моды.
    modCompileOnly("teamreborn:energy:${rootProject.reborn_energy_version}") { transitive = false }

    // Tardis Refined для Fabric: только для компиляции, в игре ставится отдельным модом.
    modCompileOnly("maven.modrinth:tardis-refined:${rootProject.tr_fabric_version}") { transitive = false }
    // AE2 на Fabric: сеть ME и карта памяти (на 1.21.1 сборки AE2 для Fabric нет, на 1.20.1 — есть).
    modCompileOnly("appeng:appliedenergistics2-fabric:${rootProject.ae2_version}") { transitive = false }
}

processResources {
    def props = [mod_id: rootProject.mod_id, mod_version: rootProject.mod_version, minecraft_version: rootProject.minecraft_version]
    inputs.properties(props)
    filesMatching('fabric.mod.json') { expand(props) }
}

shadowJar {
    exclude 'architectury.common.json'
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
    dependsOn shadowJar
}
