plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

base { archivesName = "${rootProject.mod_id}-fabric" }

configurations {
    // Код из common: в разработке — как есть, в готовый jar — после преобразования под Fabric.
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    // Конфиг на ModConfigSpec. Ставится вместе с TR (вложен в его jar), поэтому сами его не вкладываем.
    modCompileOnly "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${rootProject.forge_config_api_port_version}"
    modLocalRuntime "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${rootProject.forge_config_api_port_version}" // для игровых тестов

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }

    // Энергия: Team Reborn Energy — стандарт на Fabric. Необязательна: её обычно вкладывают в себя технические моды.
    modCompileOnly("teamreborn:energy:${rootProject.reborn_energy_version}") { transitive = false }

    // Tardis Refined для Fabric: только для компиляции, в игре ставится отдельным модом. Игровым тестам нужен и при запуске.
    modCompileOnly files("${rootDir}/libs/${rootProject.tr_fabric_jar}")
    modLocalRuntime files("${rootDir}/libs/${rootProject.tr_fabric_jar}")
}

// Игровые тесты: отдельный тестовый мод (src/gametest) с точкой входа fabric-gametest; в готовый мод не входит.
// gradlew :fabric:runGameTestServer — сервер без окна проходит тесты и выходит; упавшие тесты — ошибка сборки.
sourceSets {
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    runs {
        gameTestServer {
            server()
            source sourceSets.gametest
            systemProperties.put('fabric-api.gametest', '')
            runDirectory.set(file('build/gametest'))
            generateRunConfig.set(false)
        }
    }
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        def dir = file('build/gametest')
        dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true\n'
    }
}

processResources {
    def props = [mod_id: rootProject.mod_id, mod_version: rootProject.mod_version, minecraft_version: rootProject.minecraft_version]
    inputs.properties(props)
    filesMatching('fabric.mod.json') { expand(props) }
}

shadowJar {
    exclude 'architectury.common.json'
    // Игровые тесты — только для разработки.
    exclude 'leonus/tardis_rooms/gametest/**', 'data/tardis_rooms/structure/gametest/**'
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
    dependsOn shadowJar
}
