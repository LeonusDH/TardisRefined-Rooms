org.gradle.jvmargs=-Xmx3G

mod_id=tardis_rooms
mod_version=1.2.0
maven_group=leonus.tardis_rooms

# Ветка 1.20.1 — бэкпорт под выпущенный Tardis Refined. Основная разработка — в main (1.21.1).
minecraft_version=1.20.1
# Платформы, для которых собирается common (через запятую).
enabled_platforms=forge,fabric
forge_version=47.4.28
# Нужен common ради аннотаций @Environment и зависимостей миксинов. Другие классы Fabric Loader в common не использовать.
fabric_loader_version=0.16.14
fabric_api_version=0.92.12+1.20.1
# Конфиг на ForgeConfigSpec: в common — через Forge Config API Port (его же ставит TR на Fabric), на Forge — родной.
forge_config_api_port_version=8.0.3

# Tardis Refined — выпущенная версия с Modrinth (maven.modrinth:tardis-refined:<версия>).
tr_forge_version=neoforge-mc1.20.1-v2.1.7
tr_fabric_version=fabric-mc1.20.1-v2.1.7

# Необязательная совместимость
mekanism_version=10.4.16.80
ae2_version=15.4.12
jade_version=11.13.3
# AcuaTARDISGadgets (Modrinth hgi3Z8Z9) — права в Security Manager. Номер версии у Fabric и Forge совпадает,
# поэтому — id версии: fqdZ7cAs = fabric-1.20.1-1.0.6.1. Architectury API — та, на которой он собран.
acua_project=hgi3Z8Z9
acua_fabric_version=fqdZ7cAs
architectury_version=9.2.14
# NightConfig — только для тестов (в игре его даёт Forge или Forge Config API Port)
night_config_version=3.6.4
# Только для Fabric
reborn_energy_version=3.0.0
