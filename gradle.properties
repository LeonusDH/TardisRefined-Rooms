org.gradle.jvmargs=-Xmx3G

mod_id=tardis_rooms
mod_version=0.10.4
maven_group=leonus.tardis_rooms

minecraft_version=1.21.1
# Платформы, для которых собирается common (через запятую). Fabric добавится позже.
enabled_platforms=neoforge
neo_version=21.1.235
# Нужен common ради аннотаций @Environment и зависимостей миксинов. Другие классы Fabric Loader в common не использовать.
fabric_loader_version=0.18.4
# Конфиг на ModConfigSpec: в common — через Forge Config API Port (его же ставит TR на Fabric), на NeoForge — родной.
forge_config_api_port_version=21.1.3

# Tardis Refined из PR #618: jar собирается из ветки PR и кладётся в libs/ (см. README).
tr_neoforge_jar=tardis_refined-neoforge-1.21.1-2.1.6-pr618.jar

# Необязательная совместимость
mekanism_version=10.7.19.85
ae2_version=19.2.18
jade_version=15.10.6+neoforge
