architectury {
    common(rootProject.enabled_platforms.split(','))
}

base { archivesName = "${rootProject.mod_id}-common" }

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // Только ради класса ForgeConfigSpec (на Forge он свой, на Fabric его даёт этот мод).
    modCompileOnly "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${rootProject.forge_config_api_port_version}"
    // Tardis Refined — только для компиляции общего кода. Берём Fabric-сборку: Loom переводит её имена в имена Mojang.
    // Платформенные классы TR (пакеты *.fabric, *.forge) в common не использовать.
    modCompileOnly("maven.modrinth:tardis-refined:${rootProject.tr_fabric_version}") { transitive = false }
    // Jade: подсказки об интерфейсе. API одинаковый на обеих платформах; плагин находит Forge по @WailaPlugin, Fabric — по точке входа jade.
    modCompileOnly "maven.modrinth:jade:${rootProject.jade_version}+fabric"
}

// Общие ресурсы обеих платформ. Английский перевод генерирует датаген (gradlew :forge:runData) в src/generated/resources;
// остальные языки — обычные файлы в src/main/resources/assets/tardis_rooms/lang/.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
}

// Тесты кода без запуска игры (JUnit): gradlew :common:test. В CI — по запросу (workflow Tests).
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
}
