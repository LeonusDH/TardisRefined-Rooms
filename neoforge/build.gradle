plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

base { archivesName = "${rootProject.mod_id}-neoforge" }

configurations {
    // Код из common: в разработке — как есть, в готовый jar — после преобразования под NeoForge.
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    // При запуске (тесты, датаген) common не кладётся отдельным jar: у common и neoforge общие пакеты, и NeoForge
    // не запустит два модуля с одним пакетом. Вместо этого классы common входят в тот же мод (loom.mods ниже).
    compileClasspath.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

loom {
    mods {
        tardis_rooms {
            sourceSet sourceSets.main
            sourceSet 'main', ':common'
        }
    }
    runs {
        // gradlew :neoforge:runData — английский перевод из TRoomsText в common/src/generated/resources (файл хранится в репозитории).
        data {
            data()
            programArgs '--all', '--mod', rootProject.mod_id
            programArgs '--output', project(':common').file('src/generated/resources').absolutePath
            programArgs '--existing', project(':common').file('src/main/resources').absolutePath
        }
        // gradlew :neoforge:runGameTestServer — игровые тесты (leonus.tardis_rooms.gametest): сервер без окна
        // проходит их и выходит; упавшие тесты — ошибка сборки.
        gameTestServer {
            server()
            forgeTemplate.set('gameTestServer')
            systemProperties.put('neoforge.enabledGameTestNamespaces', rootProject.mod_id)
            runDirectory.set(file('build/gametest'))
            generateRunConfig.set(false)
        }
    }
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        def dir = file('build/gametest')
        dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true\n'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }

    // Tardis Refined: только для компиляции, в игре ставится отдельным модом. Датагену нужен и при запуске.
    modCompileOnly files("${rootDir}/libs/${rootProject.tr_neoforge_jar}")
    modLocalRuntime files("${rootDir}/libs/${rootProject.tr_neoforge_jar}")
    // Необязательная совместимость: химикаты Mekanism, сеть ME и карта памяти AE2. Без этих модов аддон работает как обычно.
    modCompileOnly "mekanism:Mekanism:${rootProject.minecraft_version}-${rootProject.mekanism_version}:api"
    modCompileOnly "org.appliedenergistics:appliedenergistics2:${rootProject.ae2_version}"
}

processResources {
    def props = [mod_id: rootProject.mod_id, mod_version: rootProject.mod_version,
                 neo_version: rootProject.neo_version, minecraft_version: rootProject.minecraft_version]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') { expand(props) }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'
    // Игровые тесты — только для разработки.
    exclude 'leonus/tardis_rooms/gametest/**', 'leonus/tardis_rooms/neoforge/gametest/**', 'data/tardis_rooms/structure/gametest/**'
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
    dependsOn shadowJar
}
